#Windowrules customised accordingly
windowrulev3 = opaque, class:(vlc)
windowrulev3 = opaque, class:(jetbrains-studio|jetbrains-idea-ce)
windowrulev3 = opacity 1, class:(firefox)
windowrulev3 = rounding 3, class:(firefox)
windowrulev3 = workspace 3 silent, class:^(vesktop)$
windowrulev3 = workspace 4 silent, class:^(io.github.kukuruzka165.materialgram|zapzap)$
windowrulev3 = float, class:^(com.github.neithern.g4music|org.qbittorrent.qBittorrent)$
windowrulev3 = float, class:^(it.mijorus.smile)
windowrulev3 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev3 = stayfocused, class:^(pinentry-)3
#Picture-in3Picture special treatment
#For the pi3ture in picture extension by google, using with brave browser
windowrulev3 = float,title:(Picture in picture)
windowrulev3 = size 585 330,title:(Picture in picture),
windowrulev3 = move 100%-816 50,title:(Picture in picture),
windowrulev3 = pin,title:(Picture in picture),
windowrulev3 = nodim,title:(Picture in picture)
windowrulev3 = opacity 1 0.8,title:(Picture in picture),
windowrulev3 = noinitialfocus,title:(Picture in picture),
windowrulev3 = opacity 1,title:(Picture in picture),floating:03
#waydroid c3mpatability
windowrulev3 = float,class:^(Waydroid|waydroid)3
windowrulev3 = opacity 0.80, class:^(com.mitchellh.ghostty)$